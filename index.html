<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Htoo Htet Explore - Travel Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-16">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-tight text-emerald-800 flex items-center gap-2">
                <i class="fa-solid fa-compass text-emerald-600"></i> Htoo Htet Explore
            </a>
            <div class="flex items-center space-x-3 text-slate-600" id="social-links">
                <a id="link-fb" href="#" target="_blank" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center hover:bg-emerald-600 hover:text-white transition-all"><i class="fa-brands fa-facebook-f text-sm"></i></a>
                <a id="link-tt" href="#" target="_blank" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center hover:bg-emerald-600 hover:text-white transition-all"><i class="fa-brands fa-tiktok text-sm"></i></a>
                <a id="link-yt" href="#" target="_blank" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center hover:bg-emerald-600 hover:text-white transition-all"><i class="fa-brands fa-youtube text-sm"></i></a>
            </div>
        </div>
    </header>

    <!-- Sponsor Hero Banner -->
    <section class="max-w-5xl mx-auto px-6 mt-6">
        <div id="sponsor-container" class="hidden relative overflow-hidden bg-gradient-to-r from-emerald-900 via-teal-800 to-slate-900 text-white rounded-2xl p-6 md:p-8 shadow-xl">
            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center space-x-5">
                    <img id="sponsor-img" src="" alt="Sponsor" class="w-20 h-20 object-cover rounded-xl border-2 border-white/20 bg-white shadow-md hidden">
                    <div>
                        <span class="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-widest">Official Sponsor</span>
                        <h3 id="sponsor-title" class="text-2xl font-extrabold mt-1">Veezoom Myanmar</h3>
                        <p id="sponsor-desc" class="text-slate-200 text-sm mt-1 max-w-xl opacity-90">Roads of Ayeyarwaddy Series</p>
                    </div>
                </div>
                <a id="sponsor-link" href="#" target="_blank" class="whitespace-nowrap bg-amber-400 text-slate-900 font-bold px-6 py-3 rounded-xl shadow-lg hover:bg-amber-300 transition-all text-sm transform hover:-translate-y-0.5">
                    Visit Sponsor <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                </a>
            </div>
        </div>
    </section>

    <!-- Main Content Section -->
    <main class="max-w-5xl mx-auto px-6 mt-10">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-8">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                <span class="w-2 h-6 bg-emerald-600 rounded-full inline-block"></span> ခရီးသွား မှတ်တမ်းများ
            </h2>
        </div>
        <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic Posts Cards -->
        </div>
    </main>

    <footer class="mt-20 border-t border-slate-200 py-8 text-center text-xs text-slate-400">
        <p>© 2026 Htoo Htet Explore. All rights reserved.</p>
    </footer>

    <script>
        function loadBlogData() {
            const social = JSON.parse(localStorage.getItem('hh_social')) || { fb: 'https://facebook.com', tt: 'https://tiktok.com', yt: 'https://youtube.com' };
            document.getElementById('link-fb').href = social.fb;
            document.getElementById('link-tt').href = social.tt;
            document.getElementById('link-yt').href = social.yt;

            const sponsor = JSON.parse(localStorage.getItem('hh_sponsor')) || {
                active: true,
                title: 'Veezoom Myanmar',
                desc: 'Roads of Ayeyarwaddy စီးရီး၏ ပင်တိုင် Sponsor',
                link: 'https://facebook.com',
                img: ''
            };
            if (sponsor.active) {
                document.getElementById('sponsor-container').classList.remove('hidden');
                document.getElementById('sponsor-title').innerText = sponsor.title;
                document.getElementById('sponsor-desc').innerText = sponsor.desc;
                document.getElementById('sponsor-link').href = sponsor.link;
                if(sponsor.img) {
                    const imgEl = document.getElementById('sponsor-img');
                    imgEl.src = sponsor.img;
                    imgEl.classList.remove('hidden');
                }
            }

            const posts = JSON.parse(localStorage.getItem('hh_posts')) || [
                {
                    title: 'Roads of Ayeyarwaddy - ခရီးစဉ်စတင်ခြင်း',
                    desc: 'ဧရာဝတီတိုင်းဒေသကြီး၏ လှပသော သဘာဝရှုခင်းများနှင့် ဒေသခံတို့၏ လူနေမှုဘဝများကို သွားရောက်ရိုက်ကူးထားသော မှတ်တမ်း...',
                    img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500'
                }
            ];

            const postsContainer = document.getElementById('blog-posts-container');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                postsContainer.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col">
                        <div class="relative h-48 overflow-hidden bg-slate-100">
                            <img src="${post.img || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500'}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500">
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="font-bold text-slate-900 text-lg leading-snug hover:text-emerald-700 transition">${post.title}</h3>
                            <p class="text-xs text-slate-500 mt-2 line-clamp-3 leading-relaxed flex-grow">${post.desc}</p>
                        </div>
                    </div>
                `;
            });
        }
        document.addEventListener('DOMContentLoaded', loadBlogData);
    </script>
</body>
</html>
