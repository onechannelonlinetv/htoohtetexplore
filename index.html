<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Htoo Htet Explore - Travel Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12">

    <!-- Header & Social Icons -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Htoo Htet Explore</h1>
            <div class="flex space-x-4 text-xl" id="social-links">
                <!-- Social links rendered dynamically -->
                <a id="link-fb" href="#" target="_blank" class="hover:text-amber-300 transition"><i class="fa-brands fa-facebook"></i></a>
                <a id="link-tt" href="#" target="_blank" class="hover:text-amber-300 transition"><i class="fa-brands fa-tiktok"></i></a>
                <a id="link-yt" href="#" target="_blank" class="hover:text-amber-300 transition"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </header>

    <!-- Sponsor Banner Area -->
    <div class="max-w-4xl mx-auto px-4 mt-6">
        <div id="sponsor-container" class="hidden bg-gradient-to-r from-amber-500 to-orange-600 text-white rounded-xl p-4 shadow-lg flex flex-col md:flex-row items-center justify-between">
            <div class="flex items-center space-x-4">
                <img id="sponsor-img" src="" alt="Sponsor" class="w-16 h-16 object-cover rounded-lg bg-white hidden">
                <div>
                    <span class="bg-amber-800 text-xs px-2 py-0.5 rounded uppercase font-bold tracking-wider">Official Sponsor</span>
                    <h3 id="sponsor-title" class="text-lg font-bold mt-1">Veezoom Myanmar</h3>
                    <p id="sponsor-desc" class="text-sm opacity-90">Roads of Ayeyarwaddy Series</p>
                </div>
            </div>
            <a id="sponsor-link" href="#" target="_blank" class="mt-3 md:mt-0 bg-white text-orange-600 font-bold px-4 py-2 rounded-lg shadow hover:bg-amber-100 transition text-sm">
                Visit Sponsor
            </a>
        </div>
    </div>

    <!-- Main Content / Posts -->
    <main class="max-w-4xl mx-auto px-4 mt-8">
        <h2 class="text-xl font-bold mb-4 text-gray-700 border-b-2 border-emerald-600 pb-2">ခရီးသွား မှတ်တမ်းများ</h2>
        <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic Posts Will Appear Here -->
        </div>
    </main>

    <!-- Hidden Secret Admin Access (Footer Click) -->
    <footer class="mt-16 text-center text-xs text-gray-400">
        <p>© 2026 Htoo Htet Explore. All rights reserved. <a href="admin.html" class="opacity-20 hover:opacity-100">[Admin]</a></p>
    </footer>

    <script>
        // Load Dynamic Data from LocalStorage/Defaults
        function loadBlogData() {
            // 1. Social Links
            const social = JSON.parse(localStorage.getItem('hh_social')) || {
                fb: 'https://facebook.com',
                tt: 'https://tiktok.com',
                yt: 'https://youtube.com'
            };
            document.getElementById('link-fb').href = social.fb;
            document.getElementById('link-tt').href = social.tt;
            document.getElementById('link-yt').href = social.yt;

            // 2. Sponsor Banner
            const sponsor = JSON.parse(localStorage.getItem('hh_sponsor')) || {
                active: true,
                title: 'Veezoom Myanmar',
                desc: 'Roads of Ayeyarwaddy စီးရီး၏ ပင်တိုင် Sponsor',
                link: 'https://facebook.com',
                img: ''
            };
            if (sponsor.active) {
                document.getElementById('sponsor-container').classList.remove('hidden');
                document.getElementById('sponsor-title').innerText = sponsor.title;
                document.getElementById('sponsor-desc').innerText = sponsor.desc;
                document.getElementById('sponsor-link').href = sponsor.link;
                if(sponsor.img) {
                    const imgEl = document.getElementById('sponsor-img');
                    imgEl.src = sponsor.img;
                    imgEl.classList.remove('hidden');
                }
            }

            // 3. Blog Posts
            const posts = JSON.parse(localStorage.getItem('hh_posts')) || [
                {
                    title: 'Roads of Ayeyarwaddy - ခရီးစဉ်စတင်ခြင်း',
                    desc: 'ဧရာဝတီတိုင်းဒေသကြီး၏ လှပသော သဘာဝရှုခင်းများနှင့် ဒေသခံတို့၏ လူနေမှုဘဝများကို သွားရောက်ရိုက်ကူးထားသော မှတ်တမ်း...',
                    img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500'
                }
            ];

            const postsContainer = document.getElementById('blog-posts-container');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                postsContainer.innerHTML += `
                    <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-lg transition">
                        <img src="${post.img || 'https://via.placeholder.com/400x200'}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-emerald-800">${post.title}</h3>
                            <p class="text-sm text-gray-600 mt-2">${post.desc}</p>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', loadBlogData);
    </script>
</body>
</html>
